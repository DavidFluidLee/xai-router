app:
  port: 8194
  debug: true
  key: dify-sandbox

max_workers: 4
max_requests: 50
worker_timeout: 5
python_path: /usr/local/bin/python3
enable_network: true
enable_preload: false
allowed_syscalls: []

proxy:
  socks5: ''
  http: ''
  https: ''

# 网关配置
gateway:
  port: 8080
  redis_addr: "localhost:6379"
  load_balancer_strategy: "least-connections"
  health_check_interval: 15
  cors_enabled: true

# Redis配置
redis:
  addr: "localhost:6379"
  password: "develop"
  db: 0
